# The gating workflow (docs/TESTING.md, "CI"): ctest in both presets, then every
# environment at full scale against the pinned Showdown. The bars are set for
# 10,000-game runs, so a scaled-down run would fail on the known gaps' noise.
name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CXX: g++-14

jobs:
  ctest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - run: cmake --preset ${{ matrix.preset }}
      - run: cmake --build --preset ${{ matrix.preset }} -j $(nproc)
      - run: ctest --preset ${{ matrix.preset }}

  env:
    needs: ctest
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        env: [ou, ou_legal, random]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - id: pin
        run: echo "commit=$(python3 -c 'import tomllib; print(tomllib.load(open("tools/criteria.toml", "rb"))["showdown"]["commit"])')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: .showdown/${{ steps.pin.outputs.commit }}
          key: showdown-${{ steps.pin.outputs.commit }}-node22
      # 16 shards as on the dev machine, so a shard's Node process stays the
      # size it was measured at, whatever the runner's core count.
      - run: python3 tools/run_env.py ${{ matrix.env }} --jobs 16 --out build/runs/${{ matrix.env }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ matrix.env }}
          path: build/runs/${{ matrix.env }}
          retention-days: 14
