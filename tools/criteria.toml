# The pass criteria per environment (docs/TESTING.md, "Pass criteria"), read by
# tools/run_env.py. Tightening a bar is a one-line diff here.
#
# Safety and chance bars are the same everywhere (zero failures); only the
# Showdown match rate relaxes from one environment to the next.

# The Showdown the tests pin (0.11.11): the gating runs and the `showdown`
# symlink. --showdown-commit or --master runs another.
[showdown]
repo = "https://github.com/smogon/pokemon-showdown.git"
commit = "c0845f33d381402dfcb18ce324c20a94f18af075"

[ou]
teams = "teams/ou"      # every *.txt in it

[ou.showdown]
games = 10000
tries = 1000000
matched = 0.999         # of the games left after multi-hit ones leave
log_only_counts = true  # a log-only mismatch is a failure
choices = 0             # choice-set mismatches allowed

[ou.soak]
games = 100000          # debug: ASan, UBSan, asserts

[ou.chance]
games = 1000
samples = 128
alpha = 1e-7            # every calibration bin's tail chance at least this

# Random OU-legal (docs/TESTING.md, "Generators"). The match bar is set from the
# 2026-10-16 rerun (99.85%; 9 of its 15 failures the Truant gap, about 9 per
# 10,000 games, which a 99.80% bar fails about 0.1% of the time).
[ou_legal]
generate = { mode = "ou-legal", teams = 2000 }

[ou_legal.showdown]
games = 10000
tries = 1000000
matched = 0.998
log_only_counts = true
choices = 0

[ou_legal.soak]
games = 100000

[ou_legal.chance]
games = 1000
samples = 128
alpha = 1e-7

# Truly random (docs/TESTING.md, "Generators"): no legality, Showdown's gen3
# custom game with the engine's two clauses. The match bar is set from the
# 2026-10-17 run at 05e74fd (99.90%, log-only counted: 10 of its 11
# failures the Truant gap or Fake Out against Focus Punch, about 9 per
# 10,000 games, which a 99.80% bar fails about 0.1% of the time).
[random]
generate = { mode = "random", teams = 2000 }

[random.showdown]
format = "custom"       # showdown_traces.cjs --format
games = 10000
tries = 1000000
matched = 0.998
log_only_counts = true
choices = 0

[random.soak]
games = 100000

[random.chance]
games = 1000
samples = 128
alpha = 1e-7
